<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Okartap</title>
<meta name="description" content="Sistema de trading Wyckoff · VSA · O/D · Elliott · ICT · CRT — DAX y SP500 intradía">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Okartap">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1520; --bg2:#161f38; --card:#1a2440; --card2:#202d50;
  --border:#253050; --text:#e8eef8; --muted:#a6b5d1; --muted2:#8392b5;
  --silver:#c8d4e8; --accent:#5b8dee; --accent2:#7fa4f2;
  --gold:#c9a84c;
  --green:#4caf82; --red:#e05555; --amber:#e09c3a;
  --radius:16px;
  font-family:'Rajdhani',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
body{padding-bottom:78px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
a{color:var(--accent2);}
h1,h2,h3,h4{margin:0 0 8px 0;font-weight:700;}
h1{font-size:21px;letter-spacing:.5px;} h2{font-size:17px;letter-spacing:1px;text-transform:uppercase;}
h3{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:2.2px;font-weight:700;}
p{margin:0 0 8px 0;line-height:1.6;color:var(--muted);font-family:'Crimson Pro',Georgia,serif;font-size:14.5px;}
button{font-family:inherit;cursor:pointer;border:none;}
input,select,textarea{font-family:'Rajdhani',sans-serif;font-weight:600;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 13px;font-size:16px;width:100%;-webkit-appearance:none;}
input::placeholder,textarea::placeholder{color:var(--muted2);font-weight:400;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--silver);}
label{display:block;font-size:11px;color:var(--muted);margin:12px 0 5px;font-weight:700;text-transform:uppercase;letter-spacing:1.3px;}
.hidden{display:none !important;}

/* ---------- App shell ---------- */
#app{max-width:640px;margin:0 auto;min-height:100vh;position:relative;}
header.topbar{
  position:sticky;top:0;z-index:20;background:rgba(14,21,32,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:env(safe-area-inset-top) 16px 0;height:calc(62px + env(safe-area-inset-top));border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
}
header.topbar .brand{display:flex;flex-direction:column;align-items:center;gap:4px;}
header.topbar .logo{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:9px;object-fit:cover;border:1px solid var(--border);display:block;}
header.topbar .brand-text div:first-child{font-weight:700;font-size:14px;letter-spacing:1.6px;text-transform:uppercase;color:var(--silver);text-align:center;}
header.topbar .brand-text div:last-child{font-size:10.5px;color:var(--muted);font-family:'Crimson Pro',Georgia,serif;font-style:italic;letter-spacing:.3px;margin-top:2px;text-align:center;}
header.topbar .header-add-btn{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:34px;height:34px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--silver);color:var(--silver);font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
main{padding:18px 16px;}

/* Bottom nav */
nav.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(14,21,32,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;max-width:640px;margin:0 auto;
  padding:8px 0 max(8px,env(safe-area-inset-bottom));
}
nav.tabbar button{
  flex:1;background:none;color:var(--muted2);display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;position:relative;
  transition:transform .15s;
}
nav.tabbar button:active{transform:scale(.92);}
nav.tabbar .nav-icon{font-size:19px;line-height:1;filter:grayscale(1) opacity(.45);transition:filter .2s;}
nav.tabbar .nav-label{color:var(--muted2);transition:color .2s;}
nav.tabbar button.active .nav-icon{filter:none;}
nav.tabbar button.active .nav-label{color:var(--silver);}
nav.tabbar button.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:2px;background:linear-gradient(90deg,transparent,var(--silver),transparent);border-radius:2px;}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.card.tight{padding:13px 15px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 8px;text-align:center;}
.stat .v{font-size:21px;font-weight:700;letter-spacing:-.3px;}
.stat .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:3px;}
.pos{color:var(--green);} .neg{color:var(--red);} .warn{color:var(--amber);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 16px;border-radius:12px;font-weight:700;font-size:13px;width:100%;font-family:'Rajdhani',sans-serif;text-transform:uppercase;letter-spacing:1.6px;transition:opacity .15s;}
.btn:active{opacity:.75;}
.btn-primary{background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--silver);color:var(--silver);}
.btn-ghost{background:var(--card);color:var(--muted);border:1px solid var(--border);}
.btn-green{background:rgba(76,175,130,.15);color:var(--green);border:1px solid rgba(76,175,130,.4);}
.btn-red{background:rgba(224,85,85,.12);color:var(--red);border:1px solid rgba(224,85,85,.35);}
.btn-sm{width:auto;padding:8px 14px;font-size:11px;}
.btn-row{display:flex;gap:8px;}

.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;}
.badge.long{background:rgba(76,175,130,.15);border:1px solid rgba(76,175,130,.35);color:var(--green);}
.badge.short{background:rgba(224,85,85,.15);border:1px solid rgba(224,85,85,.35);color:var(--red);}
.badge.skip{background:rgba(122,141,176,.12);border:1px solid var(--border);color:var(--muted);}
.badge.instr{background:rgba(91,141,238,.15);border:1px solid rgba(91,141,238,.35);color:var(--accent2);}
.badge.modo-demo{background:rgba(122,141,176,.12);border:1px solid var(--border);color:var(--muted);}
.badge.modo-real{background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.4);color:var(--gold);}

.modo-toggle{display:flex;gap:8px;margin-bottom:16px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:4px;}
.modo-btn{flex:1;background:none;border:none;color:var(--muted);font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:1.4px;padding:9px 0;border-radius:10px;transition:background .15s,color .15s;}
.modo-btn.active{background:var(--card2);color:var(--silver);border:1px solid var(--border);}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);}
th{color:var(--muted);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:1.3px;}
td{color:var(--text);}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}

.chk-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.chk-row:last-child{border-bottom:none;}
.chk-row input[type=checkbox]{width:21px;height:21px;flex:none;margin-top:1px;accent-color:var(--silver);}
.chk-row .txt{flex:1;font-size:13.5px;line-height:1.4;color:var(--text);}
.chk-row .tf{font-size:10px;color:var(--muted);background:var(--bg2);padding:2px 7px;border-radius:6px;flex:none;font-weight:600;letter-spacing:.3px;}
.block-header{display:flex;align-items:center;justify-content:space-between;margin-top:16px;}
.block-header:first-child{margin-top:0;}
.block-dot{width:9px;height:9px;border-radius:50%;background:var(--muted2);flex-shrink:0;}
.block-dot.ok{background:var(--green);}

.accordion-item{border-bottom:1px solid var(--border);}
.accordion-item:last-child{border-bottom:none;}
.accordion-head{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;cursor:pointer;}
.accordion-head h4{margin:0;font-size:14px;font-weight:700;color:var(--silver);letter-spacing:.3px;}
.accordion-head .chev{transition:transform .15s;color:var(--muted2);}
.accordion-item.open .chev{transform:rotate(90deg);}
.accordion-body{display:none;padding:0 2px 16px;font-size:13.5px;color:var(--muted);line-height:1.6;}
.accordion-item.open .accordion-body{display:block;}
.accordion-body h4{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.8px;margin:14px 0 8px;font-family:'Rajdhani',sans-serif;}
.accordion-body table{margin-top:6px;}
.accordion-body .rule{background:rgba(201,168,76,.08);border-left:3px solid var(--gold);padding:10px 12px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13px;color:var(--silver);font-family:'Crimson Pro',Georgia,serif;font-style:italic;line-height:1.5;}

.searchbar{position:relative;margin-bottom:14px;}
.searchbar input{padding-left:36px;}
.searchbar svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted2);fill:none;stroke-width:2;}

.fab{position:fixed;right:16px;bottom:90px;z-index:25;max-width:640px;}
.fab button{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--silver);color:var(--silver);font-size:26px;box-shadow:0 4px 20px rgba(0,0,0,.4);}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:var(--bg2);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;border-top:1px solid var(--border);padding:0 16px calc(24px + env(safe-area-inset-bottom));}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 12px;}
.modal-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.modal-title h2{font-size:15px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--silver);margin:0;}
.modal-title button.close{background:var(--card);color:var(--muted);width:30px;height:30px;border-radius:50%;font-size:15px;border:1px solid var(--border);}

.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;color:var(--silver);z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.show{opacity:1;}

/* Selector de fecha propio (calendario mensual estilo iOS) */
.dp-btn{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 13px;font-size:15px;font-weight:600;font-family:'Rajdhani',sans-serif;text-align:center;letter-spacing:.3px;}
.dp-btn:active{border-color:var(--silver);}
.cal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px;}
.cal{background:var(--bg2);border:1px solid var(--border);border-radius:20px;width:100%;max-width:360px;padding:16px 14px 14px;box-shadow:0 12px 40px rgba(0,0,0,.5);}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-head .mes{flex:1;text-align:center;font-weight:700;font-size:16px;letter-spacing:1px;text-transform:uppercase;color:var(--silver);}
.cal-head button{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--silver);font-size:16px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.cal-grid .dow{font-size:10.5px;font-weight:700;color:var(--muted2);letter-spacing:1px;padding:4px 0 6px;}
.cal-grid button{aspect-ratio:1;border-radius:50%;background:none;color:var(--text);font-size:15px;font-weight:600;font-family:'Rajdhani',sans-serif;}
.cal-grid button:active{background:var(--card2);}
.cal-grid button.hoy{color:var(--accent2);box-shadow:inset 0 0 0 1px var(--accent2);}
.cal-grid button.sel{background:var(--silver);color:var(--bg);box-shadow:none;}
.cal-grid button.finde{color:var(--muted);}
.cal-grid button.sel.finde{color:var(--bg);}
.cal-foot{display:flex;gap:8px;margin-top:12px;}
.cal-foot .btn{padding:10px;}
.est-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;}
.est-nav .flecha{width:42px;height:42px;flex-shrink:0;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--silver);font-size:15px;}
.est-nav .dp-btn{flex:1;max-width:240px;}
.fm .dp-btn{padding:8px 6px;font-size:14px;}
.est-kpis .stat{padding:12px 4px;}
.est-kpis .stat .v{font-size:clamp(14px,4.4vw,19px);white-space:nowrap;}

.empty{text-align:center;padding:40px 10px;color:var(--muted2);}
.empty svg{width:38px;height:38px;stroke:var(--muted2);fill:none;stroke-width:1.5;margin-bottom:10px;}
.empty div:first-of-type{font-weight:700;color:var(--muted);letter-spacing:.3px;}

.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;justify-content:center;}
.chip{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:6px 13px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;}
.chip.active{background:var(--card2);border-color:var(--silver);color:var(--silver);}

.op-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.op-item:last-child{border-bottom:none;}
.op-item:active{background:rgba(255,255,255,.03);}
.op-item .chev{flex:none;color:var(--muted2);font-size:16px;margin-left:2px;}
.op-item .dot{width:8px;height:8px;border-radius:50%;flex:none;}
.op-item .dot.demo{background:var(--muted2);} .op-item .dot.real{background:var(--gold);}
.day-head{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 8px;font-size:11px;font-weight:700;color:var(--silver);text-transform:uppercase;letter-spacing:1px;}
.day-head .n{color:var(--muted2);text-transform:none;font-weight:400;letter-spacing:0;font-family:'Crimson Pro',Georgia,serif;font-style:italic;}
.day-head .t{font-family:'Rajdhani',sans-serif;font-size:13px;letter-spacing:.3px;}
.op-item .mid{flex:1;min-width:0;}
.op-item .mid .l1{font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.op-item .mid .l2{font-size:11.5px;color:var(--muted2);margin-top:3px;font-family:'Crimson Pro',Georgia,serif;font-style:italic;}
.op-item .r{font-weight:700;font-size:15px;text-align:right;flex:none;}

.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;}

#loginScreen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:26px;max-width:420px;margin:0 auto;}
#loginScreen .logo-big{
  width:88px;height:88px;border-radius:22px;object-fit:cover;
  border:1px solid var(--border);display:block;
  margin:0 auto 20px;box-shadow:0 0 0 1px rgba(255,255,255,.03),0 8px 28px rgba(0,0,0,.45);
}
.center{text-align:center;}
#loginScreen h1{letter-spacing:2px;color:var(--silver);}
#loginScreen p.center{font-family:'Crimson Pro',Georgia,serif;font-style:italic;font-size:13.5px;}
.errtxt{color:var(--red);font-size:12.5px;min-height:18px;margin-top:8px;font-family:'Rajdhani',sans-serif;font-weight:600;}
.small{font-size:11.5px;color:var(--muted2);font-family:'Crimson Pro',Georgia,serif;font-style:italic;}
.aviso{padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.45;margin-bottom:10px;}
.aviso-red{background:rgba(224,85,85,.12);border:1px solid rgba(224,85,85,.4);color:#f0a0a0;}
.aviso-amber{background:rgba(224,156,58,.12);border:1px solid rgba(224,156,58,.4);color:#f0c080;}
.chip.err.active{background:rgba(224,85,85,.15);border-color:rgba(224,85,85,.6);color:var(--red);}
.ficha{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:14px 0 4px;font-size:13px;line-height:1.55;color:var(--text);}
.ficha div{margin-bottom:4px;}
.ficha-t{font-weight:700;text-transform:uppercase;letter-spacing:1.4px;font-size:11px;color:var(--silver);margin-bottom:8px !important;}
.ficha-oro{margin-top:8px;color:var(--gold);font-family:'Crimson Pro',Georgia,serif;font-style:italic;font-size:14px;}
.accordion-body ol{padding-left:20px;} .accordion-body li{margin-bottom:6px;}
/* ===== Rediseño compacto (01/10/2026) ===== */
.modo-toggle{margin-bottom:12px;padding:3px;border-radius:12px;}
.modo-btn{padding:7px 0;font-size:11.5px;}
.mini{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;line-height:1.2;}
/* Inicio: tira "Hoy" */
.hoy{display:flex;align-items:center;gap:12px;padding:10px 14px;}
.hoy .tag{font-size:10px;font-weight:800;letter-spacing:1.6px;color:var(--silver);text-transform:uppercase;}
.hoy .it{display:flex;flex-direction:column;gap:1px;min-width:0;}
.hoy .it b{font-size:16px;line-height:1.1;}
.hoy .sep{width:1px;align-self:stretch;background:var(--border);}
.hoy .bar{height:4px;border-radius:2px;background:var(--bg2);overflow:hidden;margin-top:4px;}
.hoy .bar i{display:block;height:100%;border-radius:2px;}
.hoy-aviso{font-size:12px;line-height:1.35;padding:7px 14px 9px;border-top:1px solid var(--border);}
/* Inicio: bloque de cifras */
.kpis6{display:grid;grid-template-columns:repeat(3,1fr);padding:4px 0;}
.kpis6 > div{padding:9px 12px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);min-width:0;}
.kpis6 > div:nth-child(3n){border-right:none;}
.kpis6 > div:nth-last-child(-n+3){border-bottom:none;}
.kpis6 .v{font-size:18px;font-weight:700;letter-spacing:-.3px;line-height:1.15;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpis6 .s{font-size:10.5px;color:var(--muted2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* Gráfica compacta en Okartap (sin tocar el bloque compartido) */
#okcDash,#okcStats{padding:12px 12px 10px;}
#okcDash .okc-head,#okcStats .okc-head{margin-bottom:8px;}
#okcDash .okc-kpis,#okcStats .okc-kpis{gap:6px;margin-bottom:8px;}
#okcDash .okc-kpi,#okcStats .okc-kpi{padding:6px 3px;border-radius:8px;}
#okcDash .okc-kpi .v,#okcStats .okc-kpi .v{font-size:clamp(11.5px,3.3vw,14px);}
#okcDash .okc-kpi .l,#okcStats .okc-kpi .l{font-size:8.5px;}
#okcDash .okc-seg button,#okcStats .okc-seg button{padding:5px 8px;font-size:10.5px;}
/* Formulario compacto */
.fm label{margin:10px 0 4px;font-size:9.5px;letter-spacing:1.1px;}
.fm input,.fm select,.fm textarea{padding:8px 10px;border-radius:9px;min-width:0;}

.fm .r3b{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.fm .r2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}

.fm .sect{display:flex;justify-content:space-between;align-items:center;margin:14px 0 2px;}
.fm .sect .t{font-size:10px;font-weight:800;letter-spacing:1.6px;color:var(--silver);text-transform:uppercase;}
.sw{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600;cursor:pointer;}
.sw input{width:16px;height:16px;padding:0;accent-color:var(--red);}
.fm .chip{padding:5px 10px;font-size:10.5px;}
/* Recuadro de riesgo y resultado */
.rk{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-top:10px;overflow:hidden;}
.rk .row3{display:grid;grid-template-columns:1.25fr 1fr 1.15fr;}
.rk .row3 > div{padding:8px 10px;border-right:1px solid var(--border);min-width:0;}
.rk .row3 > div:last-child{border-right:none;}
.rk .v{font-size:15px;font-weight:800;line-height:1.2;white-space:nowrap;}
.rk .msg{font-size:11.5px;line-height:1.35;padding:6px 10px;border-top:1px solid var(--border);}
.rk .ap{background:none;border:1px solid var(--border);color:var(--accent2);font:700 10px 'Rajdhani';letter-spacing:.6px;border-radius:6px;padding:2px 6px;margin-left:4px;text-transform:uppercase;}
.rk.empty{padding:9px 12px;font-size:12px;color:var(--muted);font-family:'Crimson Pro',Georgia,serif;font-style:italic;}
/* Ficha de operación */
.det-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin:10px 0;}
.det-hero .big{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1;}
.det-hero .sub{font-size:12.5px;color:var(--muted);margin-top:5px;font-weight:600;}
.det-hero .rt{text-align:right;font-size:12px;color:var(--muted);line-height:1.5;font-weight:600;}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
.tiles .tl{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px 9px;min-width:0;}
.tiles .tl.w2{grid-column:span 2;}
.tiles .tl.w3{grid-column:span 3;}
.tiles .tl .v{font-size:15px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tiles .tl .s{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.txtb{margin-bottom:8px;}
.txtb .tx{font-size:13.5px;color:var(--text);line-height:1.45;margin-top:3px;white-space:pre-wrap;}
.det-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px;}
canvas{width:100%;display:block;}
/* Recorrido máximo (MFE) */
.mfe-b{border-top:1px solid var(--border);padding-top:12px;margin-top:10px;}
.mfe-b:first-of-type{border-top:none;margin-top:0;padding-top:4px;}
.mfe-t{font-weight:800;color:var(--silver);letter-spacing:.6px;margin-bottom:8px;text-align:center;}
.mfe-niv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 10px;align-items:end;}
.mfe-niv div{display:flex;flex-direction:column;align-items:center;gap:2px;}
.mfe-niv b{font-size:11px;color:var(--muted);}
.mfe-niv span{font-size:15px;font-weight:800;}
.mfe-niv i{display:block;width:70%;background:rgba(76,175,130,.55);border-radius:3px 3px 0 0;}
.mfe-opt{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;text-align:center;}
.mfe-opt .v{font-size:18px;font-weight:800;margin:2px 0;}

.modal-title{position:relative;justify-content:center;}

const DEFAULT_ETIQUETAS = ["FOMO", "Entrada anticipada", "Sin planteamiento", "Stop movido", "Cierre precipitado", "Sobreoperar", "Revancha"];

// ---------- Helpers de maquetación de la Guía ----------
function gT(headers, rows) {
  return `<div class="table-wrap"><table><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
}
function gRule(t) { return `<div class="rule">${t}</div>`; }
function gH(t) { return `<h4>${t}</h4>`; }
function gP(t) { return `<p>${t}</p>`; }
function gFicha(titulo, lineas, reglaOro) {
  return `<div class="ficha"><div class="ficha-t">${titulo}</div>${lineas.map(([k, v]) => `<div><b>${k}:</b> ${v}</div>`).join("")}${reglaOro ? `<div class="ficha-oro">Regla de oro: ${reglaOro}</div>` : ""}</div>`;
}

// ---------- Secciones de la Guía (una por módulo del manual) ----------
function guiaSecciones() {
  return [
    ["wyckoff", "Módulo 1+2 · Wyckoff — Ciclos y estructuras", `
      ${gRule("El precio no se mueve por análisis técnico. Se mueve porque el dinero institucional (Composite Man) necesita acumular o distribuir posiciones sin ser detectado. Tu trabajo es leer sus huellas en el volumen y el precio.")}
      ${gH("Los 3 principios fundamentales")}
      ${gP("<b>1 · Oferta y Demanda:</b> el precio sube cuando la demanda supera a la oferta y baja cuando la oferta supera a la demanda. Las fases laterales son periodos deliberados donde el institucional construye su posición de forma controlada.")}
      ${gP("<b>2 · Causa y Efecto:</b> no hay movimiento sin preparación. Un rango lateral extenso (causa) produce un movimiento tendencial proporcionalmente grande (efecto).")}
      ${gP("<b>3 · Esfuerzo vs. Resultado:</b> si hay un volumen masivo (esfuerzo) y el precio no logra avanzar (resultado), hay absorción institucional. Esta divergencia es la base analítica fundamental.")}
      ${gH("Los 4 ciclos del mercado")}
      ${gT(["Ciclo", "Qué ocurre", "Señal en el gráfico", "Psicología del retail"], [

      ])}
      ${gH("El Creek y el Ice")}
      ${gP("El Creek es la línea de resistencia interna dentro del rango de acumulación. El Ice es su espejo bajista en distribución. No son líneas perfectas, son zonas. La ruptura del Creek con volumen es el primer aviso serio de que la acumulación termina.")}
      ${gH("El Spring — la trampa bajista")}
      ${gT(["Tipo", "Descripción", "Volumen", "Fiabilidad"], [
        ["Spring tipo 1", "Ruptura profunda, cierre fuera del rango.", "Alto", "Baja — puede continuar bajando"],
        ["Spring tipo 2", "Ruptura moderada, cierre dentro del rango.", "Alto", "Media"],

      ${gH("Glosario de señales clave Wyckoff")}
      ${gT(["Señal", "Significado", "Fase", "Acción operativa"], [

        ["SOW — Sign of Weakness", "Ruptura del Ice con intención y volumen.", "Distribución", "Confirmación de sesgo"],
        ["LPS — Last Point of Support", "Pullback de testeo con volumen mínimo.", "Acumulación", "ENTRADA DE ALTA CALIDAD"],

      ${gH("Señales y entradas (referencia rápida)")}
      ${gT(["Señal", "Fase", "Entrada"], [

        ["LPSY", "Distribución", "ENTRADA PRINCIPAL CORTO"],

      ${gH("Análisis top-down en índices")}
      ${gT(["Timeframe", "Uso"], [
        ["H4 / Diario", "Identificar el ciclo dominante — acumulación o distribución"],

        ["M15", "Afinar la zona de entrada"],
        ["M5", "El gatillo final"],
      ])}
      ${gFicha("Ficha resumen — Wyckoff", [
        ["Concepto central", "El precio lo mueven institucionales. Lee sus huellas en el volumen y la estructura."],

    ["vsa", "Módulo 3 · VSA — Volume Spread Analysis", `

      ${gT(["Elemento", "Qué es", "Lo que indica"], [

        ["Climactic Action", "Movimiento parabólico extremo, volumen récord histórico.", "Al final de tendencia.", "Agotamiento total. PROHIBIDO ENTRAR. Esperar rango."],

      ${gH("Señales VSA — referencia rápida")}
      ${gT(["Señal", "Vol", "Spread", "Cierre", "Tipo", "Acción"], [

        ["No Demand", "Bajo", "Estrecho", "Cualquiera", "Debilidad", "Entrada CORTO"],

        ["Reversal Bar", "Alto", "Amplio", "Arriba", "Fortaleza", "Confirma giro alcista"],
        ["Upthrust VSA", "Alto", "Amplio", "Abajo", "Debilidad", "Confirma giro bajista"],
        ["Esfuerzo sin resultado", "Muy alto", "Amplio", "Débil", "Debilidad", "Alerta agotamiento"],
        ["Climactic Action", "Máximo", "Muy amplio", "Extremo", "Agotamiento", "NO ENTRAR"],
      ])}
      ${gFicha("Ficha resumen — VSA", [
        ["Concepto central", "La relación entre volumen y spread dice si el movimiento es real o falso."],
        ["Señales de fortaleza", "Stopping Volume · Reversal Bar · No Supply · Test"],

// AJUSTES — guardados en la nube (iguales en todos los dispositivos)
// ---------------------------------------------------------------------
// Se guardan en un único documento "ajustes_<uid>" dentro de la misma
// colección "trading_operaciones" (así valen las reglas de seguridad que ya
// existen). No tiene campo "fecha", por lo que nunca aparece en el Diario.
// GestInmo puede leer el capital inicial en los campos capital.demo / capital.real.
// =====================================================================
const AJUSTES_DEFAULT = {
  capital: { demo: 10000, real: 10000 },
  comisiones: {},        // € ida+vuelta por mercado
  valorPunto: {},        // € por punto y contrato, por mercado
  beMargen: 1,           // ± € de resultado neto que se considera Break Even
  perdidaMaxDiariaPct: 2,
  maxOpsDia: 3,
  riesgoObjetivoPct: 0.5, // % del saldo que se quiere arriesgar por operación
  riesgoMaxPct: 1,        // % máximo por operación (aviso si se supera)
  // Contratos con los que se abre el formulario en cada mercado (24/09/2026):
  // equivalentes aproximados a 2 contratos de Nasdaq, todos a 1 €/punto.
  contratosDefecto: { NASDAQ: 2, ORO: 14, SP500: 9, DOWJONES: 1, DAX: 1 },
  etiquetas: DEFAULT_ETIQUETAS.slice(),
  revisiones: {},        // { "AAAA-MM-DD" (lunes): { error, regla, guardada } }
  graficosDelDia: {},    // { "AAAA-MM-DD": "https://drive.google.com/..." }
};
function mergeAjustes(a) {
  a = a || {};
  const num = (v, d) => (typeof v === "number" && !isNaN(v) ? v : d);
  return {
    capital: { ...AJUSTES_DEFAULT.capital, ...(a.capital || {}) },
    comisiones: { ...(a.comisiones || {}) },
    valorPunto: { ...(a.valorPunto || {}) },
    beMargen: num(a.beMargen, AJUSTES_DEFAULT.beMargen),
    perdidaMaxDiariaPct: num(a.perdidaMaxDiariaPct, AJUSTES_DEFAULT.perdidaMaxDiariaPct),
    maxOpsDia: num(a.maxOpsDia, AJUSTES_DEFAULT.maxOpsDia),
    riesgoObjetivoPct: num(a.riesgoObjetivoPct, AJUSTES_DEFAULT.riesgoObjetivoPct),
    riesgoMaxPct: num(a.riesgoMaxPct, AJUSTES_DEFAULT.riesgoMaxPct),
    contratosDefecto: { ...AJUSTES_DEFAULT.contratosDefecto, ...(a.contratosDefecto || {}) },
    etiquetas: Array.isArray(a.etiquetas) && a.etiquetas.length ? a.etiquetas.slice() : DEFAULT_ETIQUETAS.slice(),
    revisiones: { ...(a.revisiones || {}) },
    graficosDelDia: { ...(a.graficosDelDia || {}) },
    // Flags de migración
    migracionTiposSetup_2026Oct06: a.migracionTiposSetup_2026Oct06 || false,
  };
}
function lsJSON(key, def) { try { const v = JSON.parse(localStorage.getItem(key) || "null"); return v == null ? def : v; } catch (e) { return def; } }

function getCapitalInicial(modo) { const v = ajustes.capital[modo]; return typeof v === "number" ? v : 10000; }
function getComision(instrumento) { const v = ajustes.comisiones[instrumento]; return typeof v === "number" ? v : 0; }
function getContratosDefecto(instrumento) { const v = ajustes.contratosDefecto[instrumento]; return typeof v === "number" && v >= 1 ? Math.round(v) : 1; }
function getValorPunto(instrumento) { const v = ajustes.valorPunto[instrumento]; return typeof v === "number" && v > 0 ? v : 1; }

// =====================================================================
// CÁLCULOS
// =====================================================================
// Resultado neto de una operación: € bruto menos su comisión.
function netEUR(o) {
  return typeof o.resultadoEUR === "number" ? o.resultadoEUR - (o.comision || 0) : undefined;
}
// Clasificación única para toda la app (Inicio, Diario, Stats):
//   win / loss por el resultado NETO en €; "be" si cae dentro de ±beMargen €.
//   Operaciones antiguas sin € se clasifican por su R. "nd" = sin resultado.
function resultadoTipo(o) {
  if (o.tipo === "no-operacion") return "skip";
  const n = netEUR(o);
  if (typeof n === "number") {
    if (Math.abs(n) <= (ajustes.beMargen || 0)) return "be";
    return n > 0 ? "win" : "loss";
  }
  if (typeof o.resultadoR === "number") return o.resultadoR > 0 ? "win" : o.resultadoR < 0 ? "loss" : "be";
  return "nd";
}

// Calcula puntos / R / € a partir de entrada, stop (opcional), salidas y
// contratos. "puntos" es el movimiento puro del precio (media si hay varias
// salidas); el € sí tiene en cuenta los contratos.
// Calcula puntos / R / € de una operación a partir de la entrada, el stop
// inicial (opcional, para el R) y sus salidas. Cada salida lleva los
// contratos que se cerraron a ese precio: [{ salida, contratos }].
// Gestión de Patry: dos salidas — mitad en 1:1 y mitad en zona de confluencia.
//  · puntos = media ponderada por contratos (el movimiento "típico" conseguido)
//  · € = Σ puntos de cada salida × €/punto × sus contratos
//  · R = puntos medios ÷ distancia entrada-stop inicial
function calcResultado({ instrumento, direccion, entrada, stop, ordenes }) {
  const out = { puntos: null, puntosPorSalida: null, resultadoR: null, resultadoEUR: null, comision: getComision(instrumento) };
  const lista = (ordenes || []).filter(x => x && x.contratos > 0);
  const completa = lista.length > 0 && lista.every(x => typeof x.salida === "number" && !isNaN(x.salida));
  if (typeof entrada !== "number" || isNaN(entrada) || !completa) return out;
  const signo = direccion === "CORTO" ? -1 : 1;
  const vp = getValorPunto(instrumento);
  const r2 = (x, d) => Math.round(x * Math.pow(10, d)) / Math.pow(10, d); // evita decimales basura (26.0600000004)
  const puntosPorSalida = lista.map(x => r2(signo * (x.salida - entrada), 4));
  const totalContr = lista.reduce((a, x) => a + x.contratos, 0);
  out.puntos = lista.reduce((a, x, i) => a + puntosPorSalida[i] * x.contratos, 0) / totalContr;
  if (lista.length > 1) out.puntosPorSalida = puntosPorSalida;
  out.puntos = r2(out.puntos, 4);
  out.resultadoEUR = r2(lista.reduce((a, x, i) => a + puntosPorSalida[i] * vp * x.contratos, 0), 2);
  if (typeof stop === "number" && !isNaN(stop)) {
    const riesgoPuntos = Math.abs(entrada - stop);
    if (riesgoPuntos > 0) out.resultadoR = out.puntos / riesgoPuntos;
  }
  return out;
}

function opsDeModo(modo) { return state.ops.filter(o => o.tipo !== "no-operacion" && (o.modo || "demo") === modo); }
function saldoActual(modo) { return getCapitalInicial(modo) + opsDeModo(modo).reduce((a, o) => a + (netEUR(o) || 0), 0); }

// Métricas de un conjunto de operaciones (ya filtradas por modo/periodo).
// Las cifras en R solo usan operaciones con stop (las demás no tienen R).
function calcMetricas(ops) {
  const cron = ops.slice().sort((a, b) => ((a.fecha || "") + (a.hora || "")).localeCompare((b.fecha || "") + (b.hora || "")));
  const tipos = cron.map(resultadoTipo);
  const wins = tipos.filter(t => t === "win").length, losses = tipos.filter(t => t === "loss").length, bes = tipos.filter(t => t === "be").length;
  const conEUR = cron.filter(o => typeof netEUR(o) === "number");
  const netTotal = conEUR.reduce((a, o) => a + netEUR(o), 0);
  const ganado = conEUR.filter(o => netEUR(o) > 0).reduce((a, o) => a + netEUR(o), 0);
  const perdido = -conEUR.filter(o => netEUR(o) < 0).reduce((a, o) => a + netEUR(o), 0);
  const conR = cron.filter(o => typeof o.resultadoR === "number");
  const sumR = conR.reduce((a, o) => a + o.resultadoR, 0);
  const rWin = conR.filter(o => o.resultadoR > 0), rLoss = conR.filter(o => o.resultadoR < 0);
  // Drawdown máximo en € (sobre el resultado acumulado) y en R
  let acc = 0, pico = 0, ddEUR = 0;
  conEUR.forEach(o => { acc += netEUR(o); pico = Math.max(pico, acc); ddEUR = Math.max(ddEUR, pico - acc); });
  let accR = 0, picoR = 0, ddR = 0;
  conR.forEach(o => { accR += o.resultadoR; picoR = Math.max(picoR, accR); ddR = Math.max(ddR, picoR - accR); });
  const porNeto = conEUR.slice().sort((a, b) => netEUR(b) - netEUR(a));
  return {
    n: cron.length, wins, losses, bes,
    winrate: (wins + losses) ? Math.round((wins / (wins + losses)) * 100) : null,
    netTotal, ganado, perdido,
    profitFactor: perdido > 0 ? ganado / perdido : (ganado > 0 ? Infinity : null),
    nR: conR.length, sinStop: cron.length - conR.length, sumR,
    expectancy: conR.length ? sumR / conR.length : null,
    avgWinR: rWin.length ? rWin.reduce((a, o) => a + o.resultadoR, 0) / rWin.length : null,
    avgLossR: rLoss.length ? rLoss.reduce((a, o) => a + o.resultadoR, 0) / rLoss.length : null,
    ddEUR, ddR,
    mejor: porNeto[0] || null, peor: porNeto.length ? porNeto[porNeto.length - 1] : null,
  };
}

// Racha: ganadas o perdidas seguidas desde la más reciente. Las BE y las
// operaciones sin resultado no la cortan (se saltan).
function computeStreak(opsDesc) {
  let tipo = "", n = 0;
  for (const o of opsDesc) {
    const t = resultadoTipo(o);
    if (t !== "win" && t !== "loss") continue;
    if (!tipo) tipo = t;
    if (t === tipo) n++; else break;
  }
  return { n, tipo };
}

// ---------- Fechas y periodos ----------
function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function todayStr() { return ymd(new Date()); }
function nowHM() { const d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
function lunesDe(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const dow = (x.getDay() + 6) % 7; x.setDate(x.getDate() - dow); return x; }
function sumarDias(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
const PERIODOS = [["todo", "Todo"], ["semana", "Esta semana"], ["mes", "Este mes"], ["mesAnt", "Mes anterior"], ["30d", "30 días"]];
function rangoPeriodo(p) {
  const hoy = new Date();
  if (p === "semana") return [ymd(lunesDe(hoy)), todayStr()];
  if (p === "mes") return [ymd(new Date(hoy.getFullYear(), hoy.getMonth(), 1)), todayStr()];
  if (p === "mesAnt") return [ymd(new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1)), ymd(new Date(hoy.getFullYear(), hoy.getMonth(), 0))];
  if (p === "30d") return [ymd(sumarDias(hoy, -29)), todayStr()];
  return ["0000-00-00", "9999-99-99"];
}
function enRango(o, [desde, hasta]) { return (o.fecha || "") >= desde && (o.fecha || "") <= hasta; }

// ---------- Helpers para ESTUDIOS (análisis diario) ----------
function sumarDiasStr(fechaStr, n) {
  const [y, m, d] = fechaStr.split("-");
  return ymd(sumarDias(new Date(parseInt(y), parseInt(m) - 1, parseInt(d)), n));
}

// ---------- Límites de riesgo diario ----------
function estadoRiesgoHoy(modo) {
  const hoy = todayStr();
  const ops = opsDeModo(modo);
  const deHoy = ops.filter(o => o.fecha === hoy);
  const netoHoy = deHoy.reduce((a, o) => a + (netEUR(o) || 0), 0);
  const saldoInicioDia = getCapitalInicial(modo) + ops.filter(o => (o.fecha || "") < hoy).reduce((a, o) => a + (netEUR(o) || 0), 0);
  const limiteEUR = Math.max(0, saldoInicioDia * (ajustes.perdidaMaxDiariaPct || 0) / 100);
  const maxOps = ajustes.maxOpsDia || 0;
  const perdidaAlcanzada = limiteEUR > 0 && netoHoy <= -limiteEUR;
  const opsAlcanzadas = maxOps > 0 && deHoy.length >= maxOps;
  const cerca = !perdidaAlcanzada && limiteEUR > 0 && netoHoy <= -0.75 * limiteEUR;
  return { nOps: deHoy.length, maxOps, netoHoy, limiteEUR, perdidaAlcanzada, opsAlcanzadas, cerca, parar: perdidaAlcanzada || opsAlcanzadas };
}
function avisoRiesgoHtml(r) {
  if (r.parar) {
    const motivo = r.perdidaAlcanzada ? `Has alcanzado la pérdida máxima diaria (${fmtEUR(-r.limiteEUR)}).` : `Has llegado al máximo de ${r.maxOps} operaciones por día.`;
    return `<div class="aviso aviso-red"><b>⛔ Límite de riesgo alcanzado.</b> ${motivo} Tu plan dice parar por hoy.</div>`;
  }
  if (r.cerca) return `<div class="aviso aviso-amber"><b>⚠️ Cerca del límite diario:</b> llevas ${fmtEUR(r.netoHoy, true)} de un máximo de ${fmtEUR(-r.limiteEUR)}.</div>`;
  return "";
}

function opsCol() { return db.collection("trading_operaciones"); }

function attachOpsListener() {
  if (unsubscribeOps) unsubscribeOps();
  unsubscribeOps = opsCol().where("uid", "==", currentUser.uid)
    .orderBy("fecha", "desc").orderBy("hora", "desc")
    .onSnapshot((snap) => {
      const docs = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter(o => o.tipo !== "ajustes");
      // Las entradas de estudio van aparte: nunca cuentan como operaciones.
      state.estudios = docs.filter(o => o.tipo === "estudio");
      state.ops = docs.filter(o => o.tipo !== "estudio");
      // Ejecuta la migración de tipos de setup una sola vez
      if (!ajustes.migracionTiposSetup_2026Oct06 && !migracionEnCurso) {
        migrateOpTypes();
      }
      // Solo se redibujan las pestañas que muestran operaciones: así no se
      // cierra la sección de la Guía ni se borra lo que escribes en Más.
      if (["dashboard", "diario", "stats", "estudios"].includes(state.tab)) render();
    }, (err) => { toast("Error al leer datos: " + err.message); });
}

// Migración automática: convierte tipos antiguos a nueva nomenclatura T- / W-
// "Continuidad" → "T-Continuidad"
// "Giro" → "T-Giro"
// "Testeo a zona perdida" → "T-Continuidad"
let migracionEnCurso = false;
function marcarMigracionHecha() {
  ajustes.migracionTiposSetup_2026Oct06 = true;
  return ajustesRef().set({ uid: currentUser.uid, migracionTiposSetup_2026Oct06: true }, { merge: true });
}
function migrateOpTypes() {
  migracionEnCurso = true;
  const opsToMigrate = state.ops.filter(o => {
    const tipo = o.tipoSetup;
    return tipo === "Continuidad" || tipo === "Giro" || tipo === "Testeo a zona perdida";
  });

  if (opsToMigrate.length === 0) {
    // No hay nada que migrar, marca como hecho
    marcarMigracionHecha().catch(() => { migracionEnCurso = false; });
    return;
  }

  const mapping = {
    "Continuidad": "T-Continuidad",
    "Giro": "T-Giro",
    "Testeo a zona perdida": "T-Continuidad"
  };

  // Actualiza cada operación con el nuevo tipo
  const updates = opsToMigrate.map(op => {
    const newTipo = mapping[op.tipoSetup];
    return opsCol().doc(op.id).update({ tipoSetup: newTipo });
  });

  // Espera a que se actualicen todas y marca la migración como completada
  Promise.all(updates)
    .then(() => marcarMigracionHecha())
    .then(() => {
      toast(`✅ Migración completada: ${opsToMigrate.length} operaciones actualizadas`);
    })
    .catch((err) => {
      migracionEnCurso = false;
      toast("⚠️ Error en migración de tipos: " + (err && err.message || err));
    });
}

// Firestore aplica el cambio en el dispositivo al instante; la promesa solo
// se resuelve cuando lo confirma el servidor (sin cobertura puede tardar).
// Por eso las pantallas cierran sin esperar y la promesa solo avisa de errores.
function saveErr(e) { toast("⚠️ No se ha podido guardar: " + (e && e.message || e)); }
function saveOp(op, id) {
  const payload = { ...op, uid: currentUser.uid, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
  if (id) return opsCol().doc(id).update(payload);
  payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
  return opsCol().add(payload);
}
function deleteOp(id) { return opsCol().doc(id).delete(); }

// Operaciones guardadas solo en este dispositivo en el antiguo "modo local".
function getLocalOpsBackup() {
  const arr = lsJSON(LS_OPS_LEGACY, []);
  return Array.isArray(arr) ? arr : [];
}
function importLocalOps() {
  const local = getLocalOpsBackup();
  if (!local.length) { toast("No hay datos locales que importar"); return; }
  if (!confirm("¿Importar " + local.length + " operaciones guardadas en este dispositivo a tu cuenta en la nube?")) return;
  const toImport = local.map((o) => { const { id, ...rest } = o; return rest; });
  Promise.all(toImport.map((op) => saveOp(op, null))).then(() => {
    try {
      localStorage.setItem(LS_OPS_LEGACY + "_importado", localStorage.getItem(LS_OPS_LEGACY));
      localStorage.removeItem(LS_OPS_LEGACY);
    } catch (e) {}
    toast(toImport.length + " operaciones importadas a la nube");
    render();
  }).catch((e) => toast("Error al importar: " + e.message));
}

function boot() {

  const info = document.getElementById("fbProjectInfo");

function goTab(tab) {
  state.tab = tab;
  try { localStorage.setItem(LS_LAST_TAB, tab); } catch (e) {}
  document.querySelectorAll("nav.tabbar button").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));

  if (state.tab === "dashboard") v.innerHTML = renderDashboard();
  else if (state.tab === "diario") v.innerHTML = renderDiario();

  else if (state.tab === "estudios") v.innerHTML = renderEstudios();
  else if (state.tab === "referencia") v.innerHTML = renderReferencia();
  else if (state.tab === "mas") v.innerHTML = renderMas();

function fmtR(r) {
  if (r === undefined || r === null || isNaN(r)) return "—";
  return (r > 0 ? "+" : "") + fmtN(r, 2, 2) + "R";
}
const EUR_FMT = new Intl.NumberFormat("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: "always" });
// Formato español para cualquier número: punto de miles SIEMPRE (también con
// 4 cifras: 1.000) y coma decimal. dec = decimales máximos, min = mínimos.
function fmtN(x, dec = 2, min = 0) {
  if (typeof x !== "number" || isNaN(x)) return "—";
  return x.toLocaleString("es-ES", { minimumFractionDigits: min, maximumFractionDigits: dec, useGrouping: "always" });
}
function fmtEUR(n, signed) {
  if (n === undefined || n === null || isNaN(n)) return "—";
  return (signed && n > 0 ? "+" : "") + EUR_FMT.format(n) + " €";
}
function fmtDate(d) { if (!d) return ""; const [y, m, dd] = d.split("-"); return `${dd}/${m}/${y}`; }
function esc(s) { return (s == null ? "" : s).toString().replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function toneTipo(t) { return t === "win" ? "pos" : t === "loss" ? "neg" : ""; }
function nombreInstr(k) { return (INSTRUMENTOS[k] && INSTRUMENTOS[k].corto) || k || "—"; }

function diarioFilteredOps() {
  let ops = state.ops;

  if (f === "ganadas") ops = ops.filter(o => resultadoTipo(o) === "win");
  else if (f === "perdidas") ops = ops.filter(o => resultadoTipo(o) === "loss");
  else if (f === "be") ops = ops.filter(o => resultadoTipo(o) === "be");
  else if (f === "descartadas") ops = ops.filter(o => o.tipo === "no-operacion");
  else if (INSTRUMENTOS[f]) ops = ops.filter(o => o.instrumento === f);
  const dm = state.diarioModo;
  if (dm === "real" || dm === "demo") ops = ops.filter(o => (o.modo || "demo") === dm);
  if (state.diarioSearch) {
    const q = state.diarioSearch.toLowerCase();
    ops = ops.filter(o => [o.setup, o.notas, o.gestion, o.motivoDescartada, o.tipoSetup, (o.errores || []).join(" ")].join(" ").toLowerCase().includes(q));

  const dias = [], porFecha = new Map();

  return dias.map(fecha => {

    const reales = opsDelDia.filter(o => o.tipo !== "no-operacion" && typeof netEUR(o) === "number");

    return `

// Riesgo de la operación en € y % del saldo, y contratos recomendados para
// arriesgar el % objetivo (Más → Límites de riesgo). Se recalcula al cambiar
// entrada, stop, mercado, modo o contratos.
function updateRiesgo() {
  const el = document.getElementById("f_riesgo");
  if (!el) return;
  const num = (id) => { const v = document.getElementById(id).value; return v === "" ? NaN : parseFloat(v); };
  const entrada = num("f_entrada"), stop = num("f_stop");
  const instr = document.getElementById("f_instrumento").value;
  const modo = document.getElementById("f_modo").value;
  const contratos = parseInt(document.getElementById("f_contratos").value, 10) || 1;
  if (isNaN(entrada) || isNaN(stop) || entrada === stop) {
    el.innerHTML = `<div class="rk empty">Pon entrada y stop inicial para ver tu riesgo y los contratos recomendados.</div>`;
    return;
  }
  const vp = getValorPunto(instr);
  const dist = Math.abs(entrada - stop);
  const saldo = saldoActual(modo);
  const riesgo = dist * vp * contratos;
  const pct = saldo > 0 ? riesgo / saldo * 100 : 0;
  const obj = ajustes.riesgoObjetivoPct, max = ajustes.riesgoMaxPct;
  const recom = Math.floor((saldo * obj / 100) / (dist * vp));
  const maxContr = Math.floor((saldo * max / 100) / (dist * vp));
  const tono = max && pct > max ? "neg" : obj && pct > obj ? "warn" : "pos";
  const n2 = (x) => fmtN(x, 2);
  const msgs = [];
  if (max && pct > max) msgs.push(`<span class="neg">⛔ Superas tu máximo del ${n2(max)} %.</span>`);
  if (recom < 1) msgs.push(`<span class="warn">Con este stop ni 1 contrato cabe en tu ${n2(obj)} % (${fmtEUR(saldo * obj / 100)}).</span>`);
  if (dist / entrada < 0.0005) msgs.push(`<span class="warn">⚠️ Stop muy ajustado: ¿supera el spread?</span>`);
  el.innerHTML = `
  <div class="rk">
    <div class="row3">
      <div><div class="mini">Riesgo · ${contratos} contr.</div><div class="v ${tono}">${fmtEUR(riesgo)}</div><div class="mini" style="text-transform:none;letter-spacing:0" ><span class="${tono}">${n2(pct)} %</span> del saldo</div></div>
      <div><div class="mini">Al stop</div><div class="v">${n2(dist)} pts</div><div class="mini" style="text-transform:none;letter-spacing:0">${fmtEUR(vp)}/pt</div></div>
      <div><div class="mini">Al ${n2(obj)} %</div><div class="v">${recom >= 1 ? recom + " contr." : "—"}${recom >= 1 && recom !== contratos ? `<button type="button" class="ap" onclick="aplicarContratos(${recom})">Usar</button>` : ""}</div><div class="mini" style="text-transform:none;letter-spacing:0">máx. ${maxContr} al ${n2(max)} %</div></div>
    </div>
    ${msgs.length ? `<div class="msg">${msgs.join(" ")}</div>` : ""}
  </div>`;
}

// ---------- Las dos salidas (gestión de Patry) ----------
// Salida 1: la mitad de los contratos en 1:1 con el stop inicial.
// Salida 2: la otra mitad en zona de confluencia. Si el nº es impar, el

function repartoContratos(total) {
  total = Math.max(1, Math.round(total) || 1);

  const c1 = Math.ceil(total / 2);
  return [c1, total - c1];
}
function salidasIniciales(o) {

  if (Array.isArray(o.salidas) && o.salidas.length === 2 && Array.isArray(o.contratosPorSalida)) return [o.salidas[0], o.salidas[1]];
  if (Array.isArray(o.salidas) && o.salidas.length >= 2) return [o.salidas[0], o.salidas[1]];
  return [o.salida ?? null, o.salida ?? null];
}

function leerOrdenesForm() {

// ---------- Recorrido máximo a favor (MFE) ----------
// maxFavor = precio más lejano que alcanzó a favor (hasta donde Patry decida).
// Puntos que dio = desde la entrada hasta ese precio; R que dio = esos puntos
// ÷ distancia al stop inicial. Si el precio está en el lado contrario, 0.
function mfeDe(o) {
  if (typeof o.maxFavor !== "number" || typeof o.entrada !== "number") return null;
  const signo = o.direccion === "CORTO" ? -1 : 1;
  const pts = signo * (o.maxFavor - o.entrada);
  const dist = typeof o.stop === "number" ? Math.abs(o.entrada - o.stop) : 0;
  return { pts: Math.max(0, pts), R: dist > 0 ? Math.max(0, pts) / dist : null, malLado: pts < 0 };
}
function mfeFormMsg(r) {
  const g = (id) => { const el = document.getElementById(id); return el && el.value !== "" ? parseFloat(el.value) : undefined; };
  const m = mfeDe({ maxFavor: g("f_maxfavor"), entrada: g("f_entrada"), stop: g("f_stop"), direccion: document.getElementById("f_direccion").value });
  if (!m) return "";
  if (m.malLado) return `<div class="msg warn">⚠️ El máximo a favor está al otro lado de la entrada: revisa el precio.</div>`;
  const efi = r && typeof r.puntos === "number" && m.pts > 0 ? Math.round(Math.max(0, r.puntos) / m.pts * 100) : null;
  return `<div class="msg">Dio <b>+${fmtN(m.pts, 2)} pts</b>${m.R != null ? ` · <b>${fmtR(m.R)}</b>` : ""}${efi != null ? ` · capturaste el <b>${efi} %</b>` : ""}</div>`;
}

// Al editar, los resultados (puntos, R, €, comisión) solo se recalculan si
// cambian los datos de precio: entrada, stop, salidas, contratos, mercado,
// dirección o la casilla "salió en el stop". Si solo cambias notas, setup, fecha… se conservan tal cual.
// Y si la operación antigua no tiene salida (resultado metido a mano), nunca
// se borra su resultado.
function submitOpForm(id) {
  if (!document.getElementById("f_fecha")) return; // formulario ya cerrado (doble toque)
  const val = (sel) => document.getElementById(sel).value;
  const num = (sel) => { const v = val(sel); return v === "" ? null : parseFloat(v); };
  if (!val("f_fecha")) { toast("Falta la fecha"); return; }
  const ordenes = leerOrdenesForm();
  const completas = ordenes.every(x => typeof x.salida === "number" && !isNaN(x.salida));
  const totalC = ordenes.reduce((a, x) => a + x.contratos, 0);
  const salidaMedia = completas ? ordenes.reduce((a, x) => a + x.salida * x.contratos, 0) / totalC : null;
  const errores = [...document.querySelectorAll("#f_errores .chip.active")].map(b => b.dataset.err);
  const op = {
    tipo: "operacion",
    fecha: val("f_fecha"), hora: val("f_hora"), modo: val("f_modo"),
    instrumento: val("f_instrumento"), direccion: val("f_direccion"),
    tipoSetup: val("f_tiposetup") || null,
    entrada: num("f_entrada"), stop: num("f_stop"),
    contratos: num("f_contratos") || 1,
    errores,
    setup: val("f_setup"), gestion: val("f_gestion"), notas: val("f_notas"), capturaURL: val("f_captura"),
    maxFavor: num("f_maxfavor"),
  };
  const calc = readOpFormResultado();
  const resultados = {
    salida: salidaMedia,
    salidas: ordenes.length > 1 ? ordenes.map(x => x.salida) : null,
    contratosPorSalida: ordenes.length > 1 ? ordenes.map(x => x.contratos) : null,
    salioEnStop: document.getElementById("f_enstop").checked,
    puntos: calc.puntos, puntosPorSalida: calc.puntosPorSalida,
    resultadoR: calc.resultadoR, resultadoEUR: calc.resultadoEUR, comision: calc.comision,
  };
  if (!id) {
    Object.assign(op, resultados);
  } else {
    const o = state.ops.find(x => x.id === id) || {};
    const cambioPrecios = JSON.stringify(leerPreciosForm()) !== formIni;
    const sinSalidaConResultado = calc.puntos === null && typeof o.resultadoEUR === "number";
    if (cambioPrecios && !sinSalidaConResultado) Object.assign(op, resultados);
    // Si no cambian los precios, el payload no lleva resultados: Firestore
    // conserva los que ya tenía guardados.
  }
  saveOp(op, id || null).catch(saveErr);
  closeModal(); toast(id ? "Operación actualizada" : "Operación guardada");
}

// ---------- Análisis de recorrido máximo (MFE), por mercado ----------
// Simulación del objetivo de la Salida 2 con la gestión de Patry:
//  · si el recorrido llegó a 1R → la mitad cierra en +1R y el stop pasa a BE;
//    la otra mitad gana T R si el recorrido llegó a T, si no sale en BE (0).
//  · si no llegó a 1R → se considera que tocó el stop: −1R toda la posición.
function simularObjetivo(rs, T) {
  if (!rs.length) return null;
  return rs.reduce((a, r) => a + (r >= 1 ? (1 + (r >= T ? T : 0)) / 2 : -1), 0) / rs.length;
}
function mediana(arr) {
  if (!arr.length) return null;
  const a = arr.slice().sort((x, y) => x - y), m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}

  if (!conMfe.length) return `<div class="card"><h3>Recorrido máximo a favor</h3>${ayuda}</div>`;
  const porMercado = {};
  conMfe.forEach(o => { const k = o.instrumento || DEFAULT_INSTRUMENTO; (porMercado[k] = porMercado[k] || []).push(o); });
  const orden = Object.keys(INSTRUMENTOS).filter(k => porMercado[k]).concat(Object.keys(porMercado).filter(k => !INSTRUMENTOS[k]));
  const niveles = [1, 1.5, 2, 3, 4];
  const bloques = orden.map(k => {
    const lista = porMercado[k];
    const ms = lista.map(mfeDe);
    const pts = ms.map(m => m.pts), rs = ms.filter(m => m.R != null).map(m => m.R);
    const media = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
    const capt = lista.filter(o => typeof o.puntos === "number");
    const sumMfe = capt.reduce((a, o) => a + mfeDe(o).pts, 0);
    const efi = sumMfe > 0 ? Math.round(capt.reduce((a, o) => a + Math.max(0, o.puntos), 0) / sumMfe * 100) : null;
    // Objetivo óptimo: se prueban objetivos de 1R a 6R cada 0,25R
    let mejor = null;
    if (rs.length) for (let T = 1; T <= 6.001; T += 0.25) { const v = simularObjetivo(rs, T); if (!mejor || v > mejor.v + 1e-9) mejor = { T, v }; }
    const comparar = [1.5, 2, 3].map(T => ({ T, v: simularObjetivo(rs, T) }));
    return `
    <div class="mfe-b">
      <div class="mfe-t">${esc(INSTRUMENTOS[k] ? INSTRUMENTOS[k].nombre : k)} <span class="small">· ${lista.length} ${lista.length === 1 ? "operación" : "operaciones"}</span></div>
      <div class="tiles" style="margin-bottom:8px">
        <div class="tl"><div class="mini">Recorrido medio</div><div class="v">${fmtN(media(pts), 1)} pts</div><div class="s">${rs.length ? fmtR(media(rs)) : "sin stop"}</div></div>
        <div class="tl"><div class="mini">Mediano</div><div class="v">${fmtN(mediana(pts), 1)} pts</div><div class="s">${rs.length ? fmtR(mediana(rs)) : "sin stop"}</div></div>
        <div class="tl"><div class="mini">Eficiencia</div><div class="v">${efi == null ? "—" : efi + " %"}</div><div class="s">capturado</div></div>
      </div>
      ${rs.length ? `
      <div class="mini">% de operaciones que llegan a…</div>
      <div class="mfe-niv">${niveles.map(n => { const pc = Math.round(rs.filter(r => r >= n).length / rs.length * 100); return `<div><b>${fmtN(n, 1)}R</b><span>${pc} %</span><i style="height:${Math.max(3, pc * 0.4)}px"></i></div>`; }).join("")}</div>
      <div class="mfe-opt">
        <div class="mini">Objetivo óptimo para la Salida 2</div>
        <div class="v pos">${fmtN(mejor.T, 2)}R <span class="small">→ ${fmtR(mejor.v)} de media por operación</span></div>
        <div class="small">Comparado: ${comparar.map(c => `${fmtN(c.T, 1)}R → ${fmtR(c.v)}`).join(" · ")}</div>
      </div>` : `<p class="small">Pon el stop inicial en estas operaciones para calcular R y objetivos.</p>`}
    </div>`;
  }).join("");
  return `
  <div class="card">
    <h3>Recorrido máximo a favor</h3>
    ${bloques}
    <p class="small" style="margin-top:6px">Simulación con tu gestión: mitad en 1:1 y stop a BE; la otra mitad al objetivo. Si no llegó a 1R, cuenta como stop (−1R). Cuantas más operaciones apuntes, más fiable es.</p>
  </div>`;
}
function agrupar(ops, fnClave) {
  const g = {};
  ops.forEach(o => { const ks = [].concat(fnClave(o)); ks.forEach(k => { if (k == null) return; (g[k] = g[k] || []).push(o); }); });
  return g;
}

// La de evolución de la cuenta es el bloque OKCHART (script aparte, compartido con GestInmo).
function drawLine(canvasId, pts, base, dashedBase) {
  const canvas = document.getElementById(canvasId);
  if (!canvas || pts.length < 2) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = 140;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  const min = Math.min(...pts, base), max = Math.max(...pts, base);
  const range = (max - min) || 1, pad = 8;
  const stepX = (w - pad * 2) / (pts.length - 1 || 1);
  const yOf = (v) => h - pad - ((v - min) / range) * (h - pad * 2);
  ctx.strokeStyle = "#253050"; ctx.lineWidth = 1;
  if (dashedBase) ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(0, yOf(base)); ctx.lineTo(w, yOf(base)); ctx.stroke();
  ctx.setLineDash([]);
  const positive = pts[pts.length - 1] >= base;
  ctx.strokeStyle = positive ? "#4caf82" : "#e05555";
  ctx.lineWidth = 2.4; ctx.lineJoin = "round";
  ctx.beginPath();
  pts.forEach((v, i) => { const x = pad + i * stepX, y = yOf(v); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
  ctx.stroke();
  ctx.lineTo(pad + (pts.length - 1) * stepX, yOf(base)); ctx.lineTo(pad, yOf(base)); ctx.closePath();
  ctx.fillStyle = positive ? "rgba(76,175,130,.12)" : "rgba(224,85,85,.12)";
  ctx.fill();
}

// ---------- ESTUDIOS: entradas del sistema marcadas al estudiar el gráfico ----------
// Se guardan en la misma colección con tipo "estudio", pero se separan al
// leerlas (state.estudios) y NUNCA entran en Inicio, Diario, Stats ni saldo.
const RESULTADOS_ESTUDIO = [["stop", "Stop"], ["tp1", "TP1"], ["tp2", "TP2"], ["be", "BE"], ["manual", "Manual"]];

// Cálculo de una entrada de estudio. Importes en € brutos (sin comisiones).
function calcEstudio(e) {
  const out = { pts: null, R: null, eur: null, maxR: null, efic: null };
  const num = (x) => typeof x === "number" && !isNaN(x);
  if (!num(e.entrada)) return out;
  const s = e.direccion === "CORTO" ? -1 : 1;
  const vp = getValorPunto(e.instrumento);
  const contr = num(e.contratos) && e.contratos > 0 ? e.contratos : 1;
  const riesgo = num(e.stop) ? Math.abs(e.entrada - e.stop) : 0;
  let salida = null;
  if (e.resultado === "stop") salida = e.stop;
  else if (e.resultado === "tp1") salida = e.tp1;
  else if (e.resultado === "tp2") salida = e.tp2;
  else if (e.resultado === "be") salida = e.entrada;
  else if (e.resultado === "manual" && e.manualModo === "precio") salida = e.manualValor;
  if (num(salida)) {
    out.pts = s * (salida - e.entrada);
    out.eur = out.pts * vp * contr;
  } else if (e.resultado === "manual" && e.manualModo === "eur" && num(e.manualValor)) {
    out.eur = e.manualValor;
    out.pts = e.manualValor / (vp * contr);
  }
  if (num(out.pts)) {
    out.pts = Math.round(out.pts * 10000) / 10000;
    out.eur = Math.round(out.eur * 100) / 100;
    if (riesgo > 0) out.R = out.pts / riesgo;
  }
  if (num(e.maximo)) {
    const maxPts = s * (e.maximo - e.entrada);
    if (riesgo > 0) out.maxR = maxPts / riesgo;
    if (maxPts > 0 && num(out.pts)) out.efic = Math.round((out.pts / maxPts) * 100);
  }
  return out;
}

function metricasEstudios(lista) {
  const calcs = lista.map(calcEstudio);
  const conR = calcs.filter(c => typeof c.R === "number");
  const wins = conR.filter(c => c.R > 0.05).length, losses = conR.filter(c => c.R < -0.05).length;
  const ef = calcs.filter(c => typeof c.efic === "number");
  return {
    n: lista.length, wins, losses,
    sumR: conR.reduce((a, c) => a + c.R, 0),
    eur: calcs.reduce((a, c) => a + (c.eur || 0), 0),
    winrate: (wins + losses) ? Math.round(wins / (wins + losses) * 100) : null,
    eficMedia: ef.length ? Math.round(ef.reduce((a, c) => a + c.efic, 0) / ef.length) : null,
  };
}

  if (!e.resultado) { toast("Elige el resultado"); return; }

function textoReparto(v) {
  const n = Math.max(1, Math.round(parseFloat(v)) || 1);
  const [c1, c2] = repartoContratos(n);
  return c2 ? `→ ${c1} al 1:1 · ${c2} a confluencia` : "→ 1 sola salida";
}
function saveContratosDefecto() {
  const contratosDefecto = {};
  Object.keys(INSTRUMENTOS).forEach(k => { contratosDefecto[k] = Math.max(1, Math.round(leerNum("cd_" + k, 1))); });
  guardarAjustes({ contratosDefecto }, "Contratos por defecto guardados");
}
function saveComisiones() {
  const comisiones = {};
  Object.keys(INSTRUMENTOS).forEach(k => { comisiones[k] = Math.max(0, leerNum("com_" + k, 0)); });
  guardarAjustes({ comisiones }, "Comisiones guardadas");
}
function saveValorPunto() {
  const valorPunto = {};
  Object.keys(INSTRUMENTOS).forEach(k => { const v = leerNum("vp_" + k, 1); valorPunto[k] = v > 0 ? v : 1; });
  guardarAjustes({ valorPunto }, "Valor por punto guardado");
}
function saveEtiquetas() {
  const etiquetas = [...new Set(document.getElementById("aj_etiquetas").value.split("\n").map(s => s.trim()).filter(Boolean))];
  if (!etiquetas.length) { toast("Pon al menos una etiqueta"); return; }
  guardarAjustes({ etiquetas }, "Etiquetas guardadas");
}

function calcPosicion() {
  const capital = leerNum("c_capital", 0);
  const riesgoPct = leerNum("c_riesgo", 0);
  const entrada = parseFloat(document.getElementById("c_entrada").value);
  const stop = parseFloat(document.getElementById("c_stop").value);
  const valorPunto = leerNum("c_valorpunto", 1) || 1;
  const out = document.getElementById("c_result");
  if (isNaN(entrada) || isNaN(stop) || entrada === stop) { out.innerHTML = `<p class="neg">Introduce un precio de entrada y de stop válidos.</p>`; return; }
  const distancia = Math.abs(entrada - stop);
  const riesgoEUR = capital * (riesgoPct / 100);
  const contratos = riesgoEUR / (distancia * valorPunto);
  const enteros = Math.floor(contratos);
  out.innerHTML = `
    <div class="kv"><div class="k">Distancia al stop</div><div>${fmtN(distancia, 2)} pts</div></div>
    <div class="kv"><div class="k">Riesgo máximo</div><div>${fmtEUR(riesgoEUR)}</div></div>
    <div class="kv"><div class="k">Tamaño exacto</div><div>${fmtN(contratos, 2, 2)} contratos</div></div>
    <div class="kv"><div class="k">A operar (redondeo a la baja)</div><div style="font-weight:800">${enteros} contrato${enteros === 1 ? '' : 's'} · riesgo real ${fmtEUR(enteros * distancia * valorPunto)}</div></div>
    ${enteros === 0 ? `<p class="small warn">Con este stop, ni 1 contrato cabe en tu riesgo. Busca un stop más ajustado o un contrato más pequeño.</p>` : ""}`;
}
function calcRB() {
  const e = parseFloat(document.getElementById("rb_entrada").value);
  const s = parseFloat(document.getElementById("rb_stop").value);
  const t = parseFloat(document.getElementById("rb_tp").value);
  const out = document.getElementById("rb_result");
  if ([e, s, t].some(isNaN) || e === s) { out.innerHTML = `<p class="neg">Introduce entrada, stop y objetivo válidos.</p>`; return; }
  if ((t - e) * (e - s) <= 0) { out.innerHTML = `<p class="neg">El objetivo y el stop deben quedar a lados opuestos de la entrada.</p>`; return; }
  const ratio = Math.abs(t - e) / Math.abs(e - s);
  const ok = ratio >= 2;
  out.innerHTML = `
    <div class="kv"><div class="k">Ratio riesgo:beneficio</div><div style="font-weight:800" class="${ok ? 'pos' : 'neg'}">1 : ${fmtN(ratio, 2, 2)}</div></div>
    <div class="kv"><div class="k">Cumple mínimo 1:2</div><div class="${ok ? 'pos' : 'neg'}">${ok ? 'Sí' : 'No'}</div></div>`;
}

function exportCSV() {
  const rows = [["fecha", "hora", "modo", "tipo", "instrumento", "direccion", "tipoSetup", "entrada", "stop", "salida", "salidas", "contratos", "puntos", "resultadoR", "resultadoEUR", "comision", "resultadoNetoEUR", "clasificacion", "maxFavor", "recorridoPts", "recorridoR", "errores", "setup", "gestion", "notas", "motivoDescartada"]];
  state.ops.forEach(o => rows.push([o.fecha, o.hora, o.modo || "demo", o.tipo, o.instrumento, o.direccion, o.tipoSetup, o.entrada, o.stop, o.salida, (o.salidas || []).join(";"), o.contratos, o.puntos, o.resultadoR, o.resultadoEUR, o.comision, netEUR(o), resultadoTipo(o), o.maxFavor, mfeDe(o) ? mfeDe(o).pts : null, mfeDe(o) ? mfeDe(o).R : null, (o.errores || []).join(";"), o.setup, o.gestion, o.notas, o.motivoDescartada]
    .map(v => v === undefined || v === null ? "" : ("" + v).replace(/"/g, '""'))));
  const csv = "﻿" + rows.map(r => r.map(c => `"${c}"`).join(";")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "diario_trading.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

  const hoy = new Date();
  const fechaHace = (dias) => ymd(sumarDias(hoy, -dias));
  // [días atrás, modo, mercado, dirección, entrada, stop, salida, tipo setup, errores]
  const filas = [
    [18, "demo", "DAX", "LARGO", 18500, 18480, 18536, "T-Continuidad", []],
    [17, "demo", "SP500", "CORTO", 5000, 5010, 5010, "T-Giro", ["Entrada anticipada"]],

    [9, "demo", "DAX", "LARGO", 18500, 18480, 18562, "T-Continuidad", []],

    [5, "demo", "DAX", "CORTO", 18500, 18520, 18520, "T-Giro", ["Revancha"]],
    [3, "demo", "NASDAQ", "LARGO", 20000, 19970, 20000.5, "T-Continuidad", []],
    [1, "demo", "SP500", "LARGO", 5000, 4990, 5020, "T-Continuidad", []],
    [0, "demo", "DAX", "LARGO", 18500, null, 18530, "T-Continuidad", []],
    [14, "real", "DAX", "LARGO", 18500, 18480, 18528, "T-Continuidad", []],
    [8, "real", "DAX", "CORTO", 18500, 18520, 18520, "T-Giro", ["Stop movido"]],
    [4, "real", "SP500", "LARGO", 5000, 4990, 5019, "T-Continuidad", []],
  ];
  const ops = filas.map(([dias, modo, instrumento, direccion, entrada, stop, salida, tipoSetup, errores]) => {

    return {
      _test: true, tipo: "operacion", fecha: fechaHace(dias), hora: "10:" + String(10 + dias % 40).padStart(2, "0"),
      modo, instrumento, direccion, entrada, stop, salida, contratos: 1, tipoSetup, errores,
      // máximo a favor de prueba: más allá de la salida (o 1,5R si fue a stop)
      maxFavor: (() => { const sg = direccion === "CORTO" ? -1 : 1; const d = stop != null ? Math.abs(entrada - stop) : 10; const fue = sg * (salida - entrada); return Math.round((entrada + sg * Math.max(fue + d * (0.3 + (dias % 4) * 0.6), d * 0.6)) * 100) / 100; })(),
      puntos: calc.puntos, resultadoR: calc.resultadoR, resultadoEUR: calc.resultadoEUR, comision: calc.comision,
      setup: "Operación de prueba", gestion: "Datos de prueba generados automáticamente.",
      notas: "Bórrala desde Más > Datos de prueba cuando termines.",
    };
  });
  Promise.all(ops.map((op) => saveOp(op, null))).catch((e) => toast("Error al insertar: " + e.message));
  toast(ops.length + " operaciones de prueba insertadas");
}
function clearTestData() {
  const testOps = state.ops.filter(o => o._test);
  if (!testOps.length) { toast("No hay datos de prueba para borrar"); return; }
  if (!confirm("¿Borrar las " + testOps.length + " operaciones de prueba?")) return;
  Promise.all(testOps.map((o) => deleteOp(o.id))).catch((e) => toast("Error al borrar: " + e.message));
  toast("Datos de prueba borrados");
}

// ---------------------------------------------------------------------
// MODAL
// ---------------------------------------------------------------------
// ---------------------------------------------------------------------
// SELECTOR DE FECHA (calendario mensual). Sustituye al de serie del
// navegador. Guarda la fecha en un campo oculto con el mismo id de siempre,
// así el resto de la app la lee igual que antes ("AAAA-MM-DD").
// ---------------------------------------------------------------------
const MESES_ES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const DIAS_CORTO_ES = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
const dpAlCambiar = {}; // id → función a la que avisar al elegir día
function fechaLarga(f) {
  if (!f) return "Elegir fecha";
  const [y, m, d] = f.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return `${DIAS_CORTO_ES[dt.getDay()]}, ${d} ${MESES_ES[m - 1].slice(0, 3)} ${y}`;
}
function datePickerHtml(id, valor, alCambiar) {
  if (alCambiar) dpAlCambiar[id] = alCambiar; else delete dpAlCambiar[id];
  return `<input type="hidden" id="${id}" value="${esc(valor || "")}"><button type="button" class="dp-btn" id="${id}_btn" onclick="abrirCalendario('${id}')">${fechaLarga(valor)}</button>`;
}
let calEstado = null; // { id, y, m }
function abrirCalendario(id) {
  const el = document.getElementById(id);
  const f = (el && el.value) || todayStr();
  const [y, m] = f.split("-").map(Number);
  calEstado = { id, y, m: m - 1 };
  pintarCalendario();
}
function moverMesCal(n) {
  if (!calEstado) return;
  const d = new Date(calEstado.y, calEstado.m + n, 1);
  calEstado.y = d.getFullYear(); calEstado.m = d.getMonth();
  pintarCalendario();
}
function cerrarCalendario() { const bg = document.getElementById("calBg"); if (bg) bg.remove(); calEstado = null; }
function pintarCalendario() {
  const { id, y, m } = calEstado;
  const sel = (document.getElementById(id) || {}).value || "";
  const hoy = todayStr();
  const primero = (new Date(y, m, 1).getDay() + 6) % 7; // semana empieza en lunes
  const diasMes = new Date(y, m + 1, 0).getDate();
  let celdas = ["L", "M", "X", "J", "V", "S", "D"].map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < primero; i++) celdas += "<div></div>";
  for (let d = 1; d <= diasMes; d++) {
    const f = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const dow = (primero + d - 1) % 7;
    const cls = [f === sel ? "sel" : "", f === hoy ? "hoy" : "", dow >= 5 ? "finde" : ""].join(" ").trim();
    celdas += `<button type="button" class="${cls}" onclick="elegirDiaCal('${f}')">${d}</button>`;
  }
  let bg = document.getElementById("calBg");
  if (!bg) {
    bg = document.createElement("div");
    bg.className = "cal-bg"; bg.id = "calBg";
    bg.onclick = (e) => { if (e.target === bg) cerrarCalendario(); };
    document.body.appendChild(bg);
  }
  bg.innerHTML = `<div class="cal">
    <div class="cal-head"><button type="button" onclick="moverMesCal(-1)">◀</button><div class="mes">${MESES_ES[m]} ${y}</div><button type="button" onclick="moverMesCal(1)">▶</button></div>
    <div class="cal-grid">${celdas}</div>
    <div class="cal-foot"><button type="button" class="btn btn-ghost" onclick="cerrarCalendario()">Cancelar</button><button type="button" class="btn btn-primary" onclick="elegirDiaCal(todayStr())">Hoy</button></div>
  </div>`;
}
function elegirDiaCal(f) {
  if (!calEstado) return;
  const id = calEstado.id;
  cerrarCalendario();
  const el = document.getElementById(id);
  if (el) el.value = f;
  const b = document.getElementById(id + "_btn");
  if (b) b.textContent = fechaLarga(f);
  if (dpAlCambiar[id]) dpAlCambiar[id](f);
}
function elegirFechaEstudios(f) { state.estudiosFecha = f; render(); }

function openModal(innerHtml) {
  closeModal();
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.id = "activeModalBg";
  bg.onclick = (e) => { if (e.target === bg) closeModal(); };
  bg.innerHTML = `<div class="modal">${innerHtml}</div>`;
  document.body.appendChild(bg);
}
function closeModal() { cerrarCalendario(); const bg = document.getElementById("activeModalBg"); if (bg) bg.remove(); }
